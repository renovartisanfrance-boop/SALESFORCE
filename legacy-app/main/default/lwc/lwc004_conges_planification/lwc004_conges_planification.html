<template>

    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container">
        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
        <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
        <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
        </svg>
        <span class="slds-assistive-text">Cancel and close</span>
        </button>
        <div class="slds-modal__header">
        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Déclaration d'absence</h1>
        </div>
        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
            <div style="display: flex; flex-wrap: wrap;">
                <template for:each={get_prettyjson_week_get} for:item="con" for:index="index">
                    <template if:true={index}>
                    <div key={con} class="item">
                        <input type="checkbox" value={con} class="check_box" onchange={onchange_checked} name="time_selected"/>
                            {con}
                    </div>
                    </template>
                </template>
            </div>
           
        </div>
        <div class="slds-modal__footer">
        <button class="slds-button slds-button_neutral" aria-label="Cancel and close"  onclick={handleFermer} >Fermer</button>
        <button class="slds-button slds-button_brand" onclick={updateConges}>Enregistrer</button>
        </div>
        </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
   
</template>
