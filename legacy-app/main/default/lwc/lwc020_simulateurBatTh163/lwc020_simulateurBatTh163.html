<template>
    <div class="simulator-container">

        <!-- Header -->
        <div class="simulator-header">
            <div class="header-left">
                <div class="header-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="2" width="16" height="20" rx="2"/>
                        <line x1="8" y1="6" x2="16" y2="6"/>
                        <line x1="8" y1="10" x2="16" y2="10"/>
                        <line x1="8" y1="14" x2="10" y2="14"/>
                        <line x1="13" y1="14" x2="16" y2="14"/>
                        <line x1="8" y1="18" x2="10" y2="18"/>
                        <line x1="13" y1="18" x2="16" y2="18"/>
                    </svg>
                </div>
                <div>
                    <h2 class="page-title">Simulateur de commission</h2>
                    <p class="page-subtitle">BAT-TH-163 · PAC Collective Tertiaire</p>
                </div>
            </div>
            <div class="header-badge">Régie partenaire</div>
        </div>

        <!-- Body -->
        <div class="simulator-body">

            <!-- Form Section -->
            <div class="form-section">
                <div class="form-section-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                    Paramètres du dossier
                </div>

                <!-- Zone climatique -->
                <div class="form-group">
                    <div class="form-label-row">
                        <label class="form-label" for="sim-zone">
                                <svg class={zoneIconClass} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4 4 0 1 0 5 0z"/>
                                </svg>
                                <span>Zone climatique</span>
                            </label>
                            <button type="button" class={classInfoZone} data-id="zone"
                                onclick={handleInfoToggle} aria-label="Plus d'informations">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="12" y1="16" x2="12" y2="12"/>
                                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                                </svg>
                            </button>
                        </div>
                        <div class="pills-group" role="radiogroup" aria-label="Zone climatique">
                            <template for:each={zoneOptions} for:item="opt">
                                <button key={opt.value} type="button" class={opt.class} data-value={opt.value}
                                    onclick={handleZoneClick}>
                                    <template if:true={opt.iconCold}>
                                        <svg class="pill-icon" xmlns="http://www.w3.org/2000/svg"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <line x1="12" y1="2" x2="12" y2="22"/>
                                            <line x1="2" y1="12" x2="22" y2="12"/>
                                            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                                            <line x1="19.07" y1="4.93" x2="4.93" y2="19.07"/>
                                        </svg>
                                    </template>
                                    <template if:true={opt.iconWarm}>
                                        <svg class="pill-icon" xmlns="http://www.w3.org/2000/svg"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="5"/>
                                            <line x1="12" y1="1" x2="12" y2="3"/>
                                            <line x1="12" y1="21" x2="12" y2="23"/>
                                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                                            <line x1="1" y1="12" x2="3" y2="12"/>
                                            <line x1="21" y1="12" x2="23" y2="12"/>
                                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                                        </svg>
                                    </template>
                                    <span>{opt.label}</span>
                                </button>
                            </template>
                        </div>
                        <template if:true={isInfoZone}>
                            <div class="info-bubble">
                                <strong>Comment choisir la zone ?</strong>
                                <span><strong>H1</strong> : Nord, Centre, Est — commission 10 %.
                                    <strong>H2</strong> : Ouest, Sud-Ouest — commission 8 %.
                                    La zone dépend du code postal du chantier.</span>
                            </div>
                        </template>
                    </div>

                    <div class="form-group">
                        <div class="form-label-row">
                            <label class="form-label" for="sim-secteur">
                                <svg class={secteurIconClass} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M3 21h18"/>
                                    <path d="M5 21V7l8-4v18"/>
                                    <path d="M19 21V11l-6-4"/>
                                </svg>
                                <span>Secteur d'activité</span>
                            </label>
                            <button type="button" class={classInfoSecteur} data-id="secteur"
                                onclick={handleInfoToggle} aria-label="Plus d'informations">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="12" y1="16" x2="12" y2="12"/>
                                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                                </svg>
                            </button>
                        </div>
                        <div class="pills-group" role="radiogroup" aria-label="Secteur d'activité">
                            <template for:each={secteurOptions} for:item="opt">
                                <button key={opt.value} type="button" class={opt.class} data-value={opt.value}
                                    onclick={handleSecteurClick}>
                                    <template if:true={opt.iconMedical}>
                                        <svg class="pill-icon" xmlns="http://www.w3.org/2000/svg"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/>
                                        </svg>
                                    </template>
                                    <template if:true={opt.iconStore}>
                                        <svg class="pill-icon" xmlns="http://www.w3.org/2000/svg"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 9l1-6h16l1 6"/>
                                            <path d="M3 9v11h18V9"/>
                                            <path d="M9 22V12h6v10"/>
                                        </svg>
                                    </template>
                                    <span>{opt.label}</span>
                                </button>
                            </template>
                        </div>
                        <template if:true={isInfoSecteur}>
                            <div class="info-bubble">
                                <strong>Comment choisir ?</strong>
                                <span><strong>Bureaux/Santé</strong> : barème majoré (31,68 €/m²), surface min 2 000 m².
                                    <strong>Autres</strong> : commerces, entrepôts, restaurants, hôtels (18,48 €/m²),
                                    surface min 3 500 m².</span>
                            </div>
                        </template>
                </div>

                <!-- Surface chauffée -->
                <div class="form-group">
                    <div class="form-label-row">
                        <label class="form-label" for="sim-surface">
                            <svg class={surfaceIconClass} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polyline points="15 3 21 3 21 9"/>
                                <polyline points="9 21 3 21 3 15"/>
                                <line x1="21" y1="3" x2="14" y2="10"/>
                                <line x1="3" y1="21" x2="10" y2="14"/>
                            </svg>
                            <span>Surface chauffée</span>
                        </label>
                        <button type="button" class={classInfoSurface} data-id="surface"
                            onclick={handleInfoToggle} aria-label="Plus d'informations">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="16" x2="12" y2="12"/>
                                <line x1="12" y1="8" x2="12.01" y2="8"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-suffix-wrapper">
                        <input id="sim-surface" type="number" class="form-input" value={surface}
                            min="1" step="100" inputmode="numeric" placeholder="Ex. 2500"
                            oninput={handleSurfaceChange}
                            aria-label="Surface chauffée en mètres carrés">
                        <span class="input-suffix">m²</span>
                    </div>
                    <template if:true={isInfoSurface}>
                        <div class="info-bubble">
                            <strong>Quelle surface saisir ?</strong>
                            <span>Indiquez la surface <strong>totale chauffée</strong> par le futur système, en m².
                                Cette donnée détermine la prime CEE et le dimensionnement des PAC.</span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Result Section -->
            <div class="result-section">

                <template if:true={isEmpty}>
                    <div class="result-msg result-msg--info">
                        <div class="result-msg-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="16" x2="12" y2="12"/>
                                <line x1="12" y1="8" x2="12.01" y2="8"/>
                            </svg>
                        </div>
                        <div>
                            <div class="result-msg-title">Saisissez une surface</div>
                            <div class="result-msg-text">Renseignez la surface chauffée du bâtiment pour calculer votre
                                commission.</div>
                        </div>
                    </div>
                </template>

                <template if:true={isTooSmall}>
                    <div class="result-msg result-msg--error">
                        <div class="result-msg-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                                <line x1="12" y1="9" x2="12" y2="13"/>
                                <line x1="12" y1="17" x2="12.01" y2="17"/>
                            </svg>
                        </div>
                        <div>
                            <div class="result-msg-title">Surface non éligible</div>
                            <div class="result-msg-text">Surface minimum requise : <strong>{minSurfaceStr} m²</strong>
                                pour le secteur {tooSmallSecteur}. Pour les projets de plus petite taille, contactez
                                l'équipe CEF.</div>
                        </div>
                    </div>
                </template>

                <template if:true={isOk}>
                    <div class="commission-card">
                        <div class="commission-label">Votre commission estimée</div>
                        <div class="commission-display">
                            <span class="commission-num">{commissionStr}</span>
                            <span class="commission-cur">€</span>
                        </div>
                        <div class="commission-foot">pour <strong>ce dossier</strong>, à l'installation</div>
                    </div>

                    <div class="scenario-section">
                        <div class="form-section-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                            Configuration des travaux
                        </div>
                        <ul class="scenario-list">
                            <li class="scenario-item">
                                <div class="scenario-bullet scenario-bullet--blue">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"/>
                                        <path d="M12 6v6l4 2"/>
                                    </svg>
                                </div>
                                <div class="scenario-text">
                                    <strong>{nbPac} {pacWord}</strong> de {pacUnitKw} kW ({pacKwStr} kW au total)
                                </div>
                            </li>
                            <li class="scenario-item">
                                <div class="scenario-bullet scenario-bullet--orange">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                                    </svg>
                                </div>
                                <div class="scenario-text">
                                    <strong>1 chaudière gaz neuve</strong> de {boilerKwStr} kW en complément
                                </div>
                            </li>
                        </ul>
                    </div>
                </template>

                <template if:true={isOverMax}>
                    <div class="commission-card">
                        <div class="commission-label">Votre commission estimée</div>
                        <div class="commission-display">
                            <span class="commission-num">{commissionStr}</span>
                            <span class="commission-cur">€</span>
                        </div>
                        <div class="commission-foot">estimation pour <strong>ce dossier</strong>, à l'installation</div>
                    </div>

                    <div class="result-msg result-msg--audit">
                        <div class="result-msg-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="8" x2="12" y2="12"/>
                                <line x1="12" y1="16" x2="12.01" y2="16"/>
                            </svg>
                        </div>
                        <div>
                            <div class="result-msg-title">Dossier valorisable — audit approfondi requis</div>
                            <div class="result-msg-text">Au-delà du dimensionnement standard
                                (<strong>{maxSurfaceStr} m²</strong> pour ce secteur). Estimation calculée
                                <strong>au prorata</strong> de la moyenne observée sur les projets similaires. Le
                                montant définitif sera précisé après l'audit technique du dossier.</div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Footer -->
        <div class="simulator-footer">
            Configuration travaux : PAC + chaudière gaz neuve · R = 1
        </div>

    </div>
</template>
