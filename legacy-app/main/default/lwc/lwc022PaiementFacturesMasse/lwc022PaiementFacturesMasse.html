<template>
    <div class="pf-wrapper" style="position: relative;">
        <!-- En-tête dégradé -->
        <div class="pf-header">
            <p class="pf-title">Paiement en masse des factures</p>
            <p class="pf-subtitle">
                Sélectionnez un compte bénéficiaire, complétez les informations de paiement puis
                confirmez : les factures « Validé » passeront au statut « Payé ».
            </p>
        </div>

        <!-- Chargement -->
        <template lwc:if={loading}>
            <div class="pf-spinner-overlay">
                <lightning-spinner alternative-text="Chargement..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Sélection du compte bénéficiaire (repliable après choix) -->
        <div class="pf-card">
            <div class="pf-card-head compte-head" onclick={toggleCompteSection}>
                <p class="pf-section-title">Compte bénéficiaire</p>
                <span class="pf-hint-inline">{compteResume}</span>
                <lightning-icon icon-name={compteChevronIcon} size="x-small"
                    alternative-text="Afficher / masquer la sélection du compte">
                </lightning-icon>
            </div>
            <div class={compteBodyClass}>
                <p class="pf-hint">
                    Recherchez le compte : ses factures au statut « Validé » 
                    <!-- (hors lettrage) -->
                     s'affichent automatiquement.
                </p>
                <lightning-record-edit-form object-api-name={objectApiName}>
                    <div class="pf-account-picker">
                        <lightning-input-field field-name="Destinataire_Compte__c"
                            onchange={handleCompteChange}>
                        </lightning-input-field>
                    </div>
                </lightning-record-edit-form>
            </div>
        </div>

        <!-- Erreur -->
        <template lwc:if={error}>
            <div class="pf-error">{error}</div>
        </template>

        <!-- Confirmation du dernier paiement -->
        <template lwc:if={nbPayees}>
            <div class="pf-match-row pf-match-ok pf-confirmation">
                <span>✅ {nbPayees} facture(s) marquée(s) comme « Payé ». La liste a été actualisée.</span>
            </div>
        </template>

        <!-- Factures à payer -->
        <template lwc:if={showTable}>
            <div class="pf-card">
                <div class="pf-card-head">
                    <p class="pf-section-title">Factures à payer</p>
                    <span class="pf-hint-inline">{selectionSummary}</span>
                </div>
                <p class="pf-hint">
                    Saisissez une valeur sous l'en-tête d'une colonne pour la reporter sur toutes les
                    lignes ; chaque ligne reste ensuite modifiable individuellement.
                </p>

                <div class="pf-filters">
                    <lightning-input type="search" class="pf-filter-item"
                        label="Rechercher une facture" value={filtreRecherche}
                        onchange={handleRechercheChange}>
                    </lightning-input>
                </div>

                <template lwc:if={hasRowsDisplay}>
                    <table class="pf-table">
                        <thead>
                            <tr>
                                <th style="width: 3rem;">
                                    <input type="checkbox" class="pf-radio" checked={allSelected}
                                        onclick={handleSelectAll} />
                                </th>
                                <!-- Colonnes lecture seule (fieldset FS_FacturesMasse_Champs_LectureSeule) -->
                                <template for:each={columnsRO} for:item="col">
                                    <th key={col.apiName}>{col.label}</th>
                                </template>
                                <!-- Colonnes modifiables (fieldset FS_FacturesMasse_Champs_Modifiable) :
                                     libellé + saisie reportée sur toutes les lignes -->
                                <template for:each={columns} for:item="col">
                                    <th key={col.apiName} class="cell-input">
                                        <div class="th-label">
                                            {col.label}<template lwc:if={col.isRequired}><span
                                                    class="required-star">*</span></template>
                                        </div>
                                        <lightning-record-edit-form object-api-name={objectApiName}
                                            density="compact">
                                            <lightning-input-field field-name={col.apiName}
                                                value={col.masterValue} variant="label-hidden"
                                                data-field={col.apiName} onchange={handleMasterChange}>
                                            </lightning-input-field>
                                        </lightning-record-edit-form>
                                    </th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={rowsDisplay} for:item="r">
                                <tr key={r.id} class={r.rowClass}>
                                    <td>
                                        <input type="checkbox" class="pf-radio" data-id={r.id}
                                            checked={r.selected} onclick={handleToggleRow} />
                                    </td>
                                    <template for:each={r.roCells} for:item="ro">
                                        <td key={ro.key} class={ro.cellClass}>
                                            <template lwc:if={ro.hasValue}>
                                                <template lwc:if={ro.isCurrency}>
                                                    <span class="pf-amount">
                                                        <lightning-formatted-number value={ro.value}
                                                            format-style="currency" currency-code="EUR">
                                                        </lightning-formatted-number>
                                                    </span>
                                                </template>
                                                <template lwc:elseif={ro.isDate}>
                                                    <lightning-formatted-date-time value={ro.value}>
                                                    </lightning-formatted-date-time>
                                                </template>
                                                <template lwc:else>{ro.value}</template>
                                            </template>
                                            <template lwc:else><span class="pf-amount-zero">—</span></template>
                                        </td>
                                    </template>
                                    <template for:each={r.cells} for:item="c">
                                        <td key={c.key} class="cell-input">
                                            <lightning-record-edit-form object-api-name={objectApiName}
                                                density="compact">
                                                <lightning-input-field field-name={c.apiName} value={c.value}
                                                    required={c.required} variant="label-hidden" data-row="1"
                                                    data-facture-id={c.factureId} data-field={c.apiName}
                                                    onchange={handleCellChange}>
                                                </lightning-input-field>
                                            </lightning-record-edit-form>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <!-- Recherche sans résultat -->
                <template lwc:if={showFilterEmpty}>
                    <div class="pf-empty">
                        <span class="pf-empty-icon">🔍</span>
                        Aucune facture ne correspond à la recherche.
                    </div>
                </template>

                <div class="pf-totals">
                    <div class="pf-total-row pf-total-row-dual">
                        <span class="pf-total-item">
                            <span class="pf-total-label">Factures sélectionnées</span>
                            <span class="pf-amount pf-total-value">{selectedCount}</span>
                        </span>
                        <span class="pf-total-item">
                            <span class="pf-total-label">Total TTC à payer</span>
                            <span class="pf-amount pf-total-value">
                                <lightning-formatted-number value={totalSelected}
                                    format-style="currency" currency-code="EUR">
                                </lightning-formatted-number>
                            </span>
                        </span>
                    </div>
                </div>
            </div>
        </template>

        <!-- État vide -->
        <template lwc:if={showEmpty}>
            <div class="pf-card">
                <div class="pf-empty">
                    <span class="pf-empty-icon">✨</span>
                    Aucune facture au statut « Validé » pour ce compte.
                </div>
            </div>
        </template>

        <!-- Actions -->
        <div class="pf-footer">
            <lightning-button label="Fermer" onclick={handleClose}></lightning-button>
            <lightning-button class="pf-next-btn" label={confirmLabel} variant="brand"
                disabled={confirmDisabled} onclick={handleConfirm}>
            </lightning-button>
        </div>

        <!-- Modale de confirmation avant paiement -->
        <template lwc:if={showConfirmModal}>
            <div class="pf-modal-backdrop" onclick={handleModalCancel}></div>
            <div class="pf-modal" role="dialog" aria-modal="true">
                <p class="pf-modal-title">Confirmer le paiement</p>
                <p class="pf-modal-text">
                    Vous allez marquer <strong>{selectedCount} facture(s)</strong> comme « Payé »
                    pour un total de
                    <strong>
                        <lightning-formatted-number value={totalSelected} format-style="currency"
                            currency-code="EUR">
                        </lightning-formatted-number>
                    </strong> TTC.
                    <br />Cette action met à jour le statut des factures sélectionnées.
                </p>
                <div class="pf-modal-footer">
                    <lightning-button label="Annuler" onclick={handleModalCancel}></lightning-button>
                    <lightning-button class="pf-next-btn" variant="brand" label="Confirmer le paiement"
                        onclick={handleModalConfirm}>
                    </lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
