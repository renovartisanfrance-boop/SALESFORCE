    <!-- Add collapse here : Infos autres dossiers -->
    <template if:true={hasSiblingDossiers}>
        <div class="fi-collapse">
            <button class="fi-collapse-toggle" onclick={toggleOtherDossiers}>
                <lightning-icon icon-name={otherDossiersIcon} size="x-small" class="fi-collapse-icon"></lightning-icon>
                Infos autres dossiers
            </button>
            <template if:true={isOtherDossiersOpen}>
                <div class="fi-collapse-content">
                    <template for:each={siblingDossiersSummary} for:item="dossier">
                        <div key={dossier.id} class="fi-dossier-recap">
                            <div class="fi-dossier-header">
                                <span class="fi-dossier-fiche">{dossier.fiche}</span>
                                <lightning-button
                                    icon-name="utility:new_window"
                                    icon-position="left"
                                    variant="base"
                                    label="Lien vers dossier"
                                    data-id={dossier.id}
                                    onclick={navigateToDossier}
                                    class="fi-nav-btn"
                                ></lightning-button>
                            </div>
                            <template for:each={dossier.fields} for:item="field">
                                <div key={field.label} class="fi-dossier-field">
                                    <span class="fi-field-label">{field.label} :</span>
                                    <span class="fi-field-value">{field.value}</span>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </template>
