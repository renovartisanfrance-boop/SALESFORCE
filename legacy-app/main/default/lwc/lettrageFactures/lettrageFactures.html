<template>
    <div class="pf-wrapper" style="position: relative;">

        <template lwc:if={isEdition}>
            <div class="pf-header">
                <p class="pf-title">Liaison des factures au lettrage</p>
                <p class="pf-subtitle">Sélectionnez les factures à rattacher à ce lettrage</p>
            </div>
        </template>

        <template lwc:if={loading}>
            <div class="pf-spinner-overlay">
                <lightning-spinner alternative-text="Chargement..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Factures disponibles -->
        <div class="pf-card">
            <div class="pf-card-head">
                <p class="pf-section-title">Factures disponibles</p>
                <span class="pf-hint-inline">{selectionSummary}</span>
            </div>

            <template lwc:if={hasDispos}>
                <p class="pf-hint">Cochez les factures à lier à ce lettrage</p>

                <div class="pf-filters">
                    <lightning-input
                        type="search"
                        class="pf-filter-item"
                        label="N° Facture"
                        value={filterNumFacture}
                        onchange={handleFilterNumFacture}>
                    </lightning-input>
                    <lightning-input
                        type="search"
                        class="pf-filter-item"
                        label="N° Facture (Externe)"
                        value={filterNumExterne}
                        onchange={handleFilterNumExterne}>
                    </lightning-input>
                </div>

                <template lwc:if={hasFilteredDispos}>
                <table class="pf-table">
                    <thead>
                        <tr>
                            <th style="width: 3rem;">
                                <input type="checkbox" class="pf-radio" checked={allSelected}
                                    onclick={handleSelectAll} />
                            </th>
                            <th>N° Facture</th>
                            <th>N° Facture (Externe)</th>
                            <th>Bénéficiaire</th>
                            <th>Montant Total</th>
                            <th>Date Paiement</th>
                            <th>Réf. Bancaire</th>
                            <th>Moyen</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={facturesDisponiblesDisplay} for:item="f">
                            <tr key={f.id} data-id={f.id} class={f.rowClass} onclick={handleToggleRow}>
                                <td>
                                    <input type="checkbox" class="pf-radio" data-id={f.id} checked={f.selected}
                                        onclick={handleCheckboxChange} />
                                </td>
                                <td><strong>{f.name}</strong></td>
                                <td>{f.numExterne}</td>
                                <td>{f.destinataire}</td>
                                <td>
                                    <template lwc:if={f.montant}>
                                        <span class="pf-amount">
                                            <lightning-formatted-number value={f.montant} format-style="currency"
                                                currency-code="EUR">
                                            </lightning-formatted-number>
                                        </span>
                                    </template>
                                    <template lwc:else><span class="pf-amount-zero">—</span></template>
                                </td>
                                <td>{f.datePaiement}</td>
                                <td>{f.referenceBancaire}</td>
                                <td>{f.moyenPaiement}</td>
                                <td><span class={f.statutBadgeClass}>{f.statut}</span></td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <div class="pf-total-row">
                    <span class="pf-total-label">Total sélectionné</span>
                    <span class="pf-amount pf-total-value">
                        <lightning-formatted-number value={totalSelected} format-style="currency" currency-code="EUR">
                        </lightning-formatted-number>
                    </span>
                </div>
                </template>

                <template lwc:else>
                    <div class="pf-empty">
                        <span class="pf-empty-icon">🔍</span>
                        Aucune facture ne correspond aux filtres.
                    </div>
                </template>
            </template>

            <template lwc:else>
                <div class="pf-empty">
                    <span class="pf-empty-icon">✨</span>
                    Aucune facture validée disponible à lier.
                </div>
            </template>
        </div>

        <!-- Factures déjà liées -->
        <template lwc:if={showLiees}>
            <div class="pf-card">
                <p class="pf-section-title">Factures déjà liées ({facturesLiees.length})</p>

                <table class="pf-table">
                    <thead>
                        <tr>
                            <th>N° Facture</th>
                            <th>N° Facture (Externe)</th>
                            <th>Bénéficiaire</th>
                            <th>Montant Total</th>
                            <th>Date Paiement</th>
                            <th>Réf. Bancaire</th>
                            <th>Moyen</th>
                            <th>Statut</th>
                            <th style="width: 5rem;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={facturesLieesDisplay} for:item="f">
                            <tr key={f.id} class="slds-hint-parent">
                                <td><strong>{f.name}</strong></td>
                                <td>{f.numExterne}</td>
                                <td>{f.destinataire}</td>
                                <td>
                                    <template lwc:if={f.montant}>
                                        <span class="pf-amount">
                                            <lightning-formatted-number value={f.montant} format-style="currency"
                                                currency-code="EUR">
                                            </lightning-formatted-number>
                                        </span>
                                    </template>
                                    <template lwc:else><span class="pf-amount-zero">—</span></template>
                                </td>
                                <td>{f.datePaiement}</td>
                                <td>{f.referenceBancaire}</td>
                                <td>{f.moyenPaiement}</td>
                                <td><span class={f.statutBadgeClass}>{f.statut}</span></td>
                                <td>
                                    <lightning-button-icon icon-name="utility:close" variant="bare"
                                        alternative-text="Délier" title="Délier cette facture" data-id={f.id}
                                        onclick={handleUnlink}>
                                    </lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <template lwc:if={isEdition}>
            <div class="pf-footer">
                <lightning-button label="Fermer" onclick={handleClose}></lightning-button>
                <lightning-button class="pf-next-btn" label={linkLabel} variant="brand" disabled={linkDisabled}
                    onclick={handleLink}>
                </lightning-button>
            </div>
        </template>
    </div>
</template>
