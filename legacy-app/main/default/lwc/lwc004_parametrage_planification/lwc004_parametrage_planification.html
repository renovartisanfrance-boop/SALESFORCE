<template>
    <div>
        <template if:true={spinner}>
        <div class="demo-only demo-only_viewport" style="height:3rem;float: right;">
            <div role="status" class="slds-spinner slds-spinner_small">
              <span class="slds-assistive-text">Loading</span>
              <div class="slds-spinner__dot-a"></div>
              <div class="slds-spinner__dot-b"></div>
            </div>
          </div>
        </template>
        
        <h1 class="_titre">Paramétrage</h1>
        <div class="_groupe_button">
            <lightning-button variant="brand" onclick={handelclick_enregitrer_metadata} label="Enregistrer" title="Primary action" data-id="1"  class="slds-m-left_x-small _button_parametrage"></lightning-button>
            <lightning-button variant="destructive" label="Fermer" title="Fermer" onclick={sendDataToParent} class="slds-m-left_x-small"></lightning-button>
        </div>
        <label class="_label" for="json-input">Entrez JSON code:</label>
        <br>
        <textarea class="_json-input _textarea"  rows="8" cols="50" onchange={json_input_change}>{_prettyjson}</textarea>
        <br>
    </div>
   
</template>
