<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pistes — maquette portail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan : barre de pilotage (compteurs + filtres) au-dessus, liste des pistes à gauche,
   fiche de la piste sélectionnée à droite. Vert pétrole = marque, ambre = action. */
:root {
  --bg: #f3f6f6;
  --surface: #ffffff;
  --ink: #142326;
  --muted: #5d6f73;
  --line: #dde5e6;
  --brand: #0d5c63;
  --brand-soft: #e3f0f0;
  --accent: #e8913a;
  --accent-ink: #3b2306;
  --ok: #1f8a4c; --ok-soft: #e2f4ea;
  --warn: #b7791f; --warn-soft: #fbf0dc;
  --bad: #c2413b; --bad-soft: #fbe6e4;
  --info: #2f6db3; --info-soft: #e3edf9;
  --shadow: 0 1px 2px rgba(16,40,44,.06), 0 6px 20px rgba(16,40,44,.06);
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1719; --surface: #152225; --ink: #e6efef; --muted: #93a6a9; --line: #253639;
    --brand: #4fb3b9; --brand-soft: #18363a; --accent: #f0a050; --accent-ink: #2a1703;
    --ok: #4cc27f; --ok-soft: #173426; --warn: #e2b154; --warn-soft: #362a12;
    --bad: #ec7b74; --bad-soft: #3a1c1a; --info: #7aa9e6; --info-soft: #182a40;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1719; --surface: #152225; --ink: #e6efef; --muted: #93a6a9; --line: #253639;
  --brand: #4fb3b9; --brand-soft: #18363a; --accent: #f0a050; --accent-ink: #2a1703;
  --ok: #4cc27f; --ok-soft: #173426; --warn: #e2b154; --warn-soft: #362a12;
  --bad: #ec7b74; --bad-soft: #3a1c1a; --info: #7aa9e6; --info-soft: #182a40;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* En-tête du portail */
.topbar { background: var(--brand); color: #fff; }
:root[data-theme="dark"] .topbar { background: #0b3a3f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .topbar { background: #0b3a3f; } }
.topbar-in { max-width: 1440px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 28px; }
.logo { font: 700 17px var(--f-display); display: flex; align-items: center; gap: 10px; letter-spacing: -.01em; }
.logo-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.nav { display: flex; gap: 4px; }
.nav a { color: rgba(255,255,255,.75); text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 500; }
.nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.14); }
.user { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-weight: 700; font-size: 13px; }

main { max-width: 1440px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }

/* Titre + bouton principal */
.head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font: 700 28px/1.2 var(--f-display); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--brand); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.05); border-color: var(--accent); }
.btn svg { width: 16px; height: 16px; }

/* Compteurs = filtres rapides */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: left; cursor: pointer; display: grid; gap: 2px; position: relative; box-shadow: var(--shadow); }
.kpi::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c, var(--brand)); }
.kpi[aria-pressed="true"] { border-color: var(--c, var(--brand)); outline: 1px solid var(--c, var(--brand)); }
.kpi .n { font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 13px; font-weight: 500; }
.kpi .d { font-size: 12px; color: var(--muted); }

/* Barre d'outils */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 260px; position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; color: var(--muted); }
.toolbar select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 9px 12px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); }

/* Liste + fiche */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.list-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.list-head strong { color: var(--ink); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--brand-soft); }
tbody tr[aria-selected="true"] { background: var(--brand-soft); box-shadow: inset 3px 0 0 var(--brand); }
tbody tr:last-child td { border-bottom: 0; }
.who { display: flex; align-items: center; gap: 10px; min-width: 190px; }
.ini { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--brand-soft); color: var(--brand); flex: none; }
.who b { display: block; font-weight: 600; }
.who span { color: var(--muted); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--s-bg); color: var(--s-fg); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-new { --s-bg: var(--info-soft); --s-fg: var(--info); }
.st-nrp { --s-bg: var(--warn-soft); --s-fg: var(--warn); }
.st-call { --s-bg: var(--brand-soft); --s-fg: var(--brand); }
.st-conf { --s-bg: var(--ok-soft); --s-fg: var(--ok); }
.st-out { --s-bg: var(--bad-soft); --s-fg: var(--bad); }

.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.mpr { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.mpr i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.mpr-bleu i { background: #2c5fd4; } .mpr-jaune i { background: #e3b51b; } .mpr-violet i { background: #8b4fc9; } .mpr-rose i { background: #e06a9a; }
.age { color: var(--muted); font-size: 13px; white-space: nowrap; }
.age.late { color: var(--bad); font-weight: 600; }
.empty { padding: 40px; text-align: center; color: var(--muted); }

/* Fiche */
.detail { position: sticky; top: 16px; overflow: hidden; }
.d-top { padding: 20px; display: grid; gap: 14px; border-bottom: 1px solid var(--line); }
.d-id { display: flex; gap: 14px; align-items: center; }
.d-id .ini { width: 48px; height: 48px; font-size: 17px; }
.d-id h2 { font: 700 20px/1.2 var(--f-display); margin: 0; }
.d-id p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.actions .btn { justify-content: center; padding: 9px 8px; font-size: 14px; }
.d-sec { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.d-sec:last-child { border-bottom: 0; }
.d-sec h3 { margin: 0; font: 600 12px var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; }
dl { margin: 0; display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; font-weight: 500; }

.meter { display: grid; gap: 6px; }
.meter-bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter-bar span { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.checks li { display: flex; gap: 8px; align-items: center; }
.checks li::before { content: "✓"; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--ok-soft); color: var(--ok); flex: none; }
.checks li.miss { color: var(--muted); }
.checks li.miss::before { content: "!"; background: var(--warn-soft); color: var(--warn); }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: 14px; }
.timeline li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; }
.timeline li::before { content: ""; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; border: 2px solid var(--brand); background: var(--surface); }
.timeline small { color: var(--muted); display: block; }

.cta { padding: 16px 20px; background: var(--brand-soft); display: grid; gap: 8px; }
.cta .btn-primary { justify-content: center; padding: 12px; }
.cta p { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1150px) { .work { grid-template-columns: 1fr; } .detail { position: static; } .hide-md { display: none; } }
@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } .nav { display: none; } }
@media (max-width: 480px) { main { padding: 16px; } .topbar-in { padding: 0 16px; } .user span { display: none; } h1 { font-size: 23px; } .actions { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Choix de la fiche (filtre obligatoire) */
.step-label { font: 600 12px var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
.fiches { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.fiche { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: grid; gap: 2px; box-shadow: var(--shadow); }
.fiche:hover { border-color: var(--brand); }
.fiche[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.fiche[aria-selected="true"] .fm { color: rgba(255,255,255,.8); }
.fiche .fc { font: 700 16px var(--f-display); letter-spacing: -.01em; }
.fiche .fn { font-weight: 600; }
.fiche .fm { font-size: 13px; color: var(--muted); }
.fiche .hot { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12px; }

/* Statuer */
.decide { display: grid; gap: 10px; }
.decide-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dbtn { border: 1px solid var(--line); border-top: 3px solid var(--c); background: var(--surface); border-radius: 12px; padding: 10px; cursor: pointer; text-align: left; display: grid; gap: 2px; font-weight: 700; font-size: 14px; }
.dbtn small { font-weight: 500; color: var(--muted); font-size: 12px; line-height: 1.3; }
.dbtn:hover { border-color: var(--c); }
.dbtn[aria-expanded="true"] { border-color: var(--c); outline: 1px solid var(--c); }
.decide-form { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.decide-form label { font-size: 13px; font-weight: 600; }
.decide-form input, .decide-form select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.big { justify-content: center; padding: 12px; width: 100%; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.checks li.toggle { cursor: pointer; }
.checks li.toggle:hover { color: var(--ink); }
.open-link { justify-self: start; text-decoration: none; color: var(--brand); }

/* Fiche pleine page */
#fiche-view { max-width: 1440px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
.back { color: var(--brand); text-decoration: none; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { text-decoration: underline; }
.fp-head { padding: 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.fp-head .d-id { flex: 1 1 320px; }
.fp-head .ini { width: 56px; height: 56px; font-size: 19px; }
.fp-head h2 { font-size: 24px; }
.fp-nav { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.fp-nav .btn { text-decoration: none; }
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.stepper div { padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--muted); border-right: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.stepper div:last-child { border-right: 0; }
.stepper b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--line); color: var(--muted); flex: none; }
.stepper .done b { background: var(--ok); color: #fff; }
.stepper .cur { color: var(--ink); background: var(--brand-soft); }
.stepper .cur b { background: var(--brand); color: #fff; }
.stepper .stop { color: var(--bad); background: var(--bad-soft); }
.stepper .stop b { background: var(--bad); color: #fff; }
.fp-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
.fp-main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.fp-main .card { overflow: hidden; }
.fp-main .wide { grid-column: 1 / -1; }
.fp-side { position: sticky; top: 16px; display: grid; gap: 20px; }
@media (max-width: 1150px) { .fp-grid { grid-template-columns: 1fr; } .fp-side { position: static; } }
@media (max-width: 700px) { .fp-main { grid-template-columns: 1fr; } .stepper { grid-template-columns: 1fr 1fr; } .decide-grid { grid-template-columns: 1fr; } }
[hidden] { display: none !important; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo"><span class="logo-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </span>Renov Artisan France</div>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#">Accueil</a>
      <a href="#" aria-current="page">Pistes</a>
      <a href="#">Dossiers</a>
      <a href="#">Reporting dossiers</a>
      <a href="#">Standard</a>
      <a href="#">Campagnes (régies)</a>
    </nav>
    <div class="user"><span>Claire Henry · Confirmatrice</span><div class="avatar" aria-hidden="true">CH</div></div>
  </div>
</header>

<main id="list-view">
  <div class="head">
    <div>
      <h1>Pistes</h1>
      <p class="sub">Mercredi 4 novembre · choisissez une fiche pour afficher ses pistes</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div class="seg" role="group" aria-label="Pays">
        <button type="button" data-country="FR" aria-pressed="true">France</button>
        <button type="button" data-country="ES" aria-pressed="false">España</button>
      </div>
      <button class="btn" type="button" data-toast="Choix de la campagne (à brancher)">Ajouter à une campagne</button>
      <button class="btn btn-primary" type="button" data-toast="Formulaire « Nouvelle piste » (à brancher)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle piste
      </button>
    </div>
  </div>

  <section aria-labelledby="lbl-fiche">
    <p class="step-label" id="lbl-fiche">Fiche</p>
    <div class="fiches" role="tablist" aria-label="Fiche" id="fiches"></div>
  </section>

  <section class="kpis" aria-label="Compteurs par statut" id="kpis"></section>

  <div class="toolbar">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Nom, téléphone, ville ou code postal" aria-label="Rechercher une piste">
    </label>
    <select id="f-src" aria-label="Filtrer par source"></select>
  </div>

  <div class="work">
    <section class="card" aria-label="Liste des pistes">
      <div class="list-head"><span><strong id="count">0</strong> pistes · <span id="list-fiche"></span></span><span>Double-clic pour ouvrir la fiche</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Contact</th><th>Statut</th><th class="hide-md">Revenus MPR</th><th class="hide-md">Source</th><th>Prochaine action</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <aside class="card detail" id="detail" aria-live="polite"></aside>
  </div>
</main>

<main id="fiche-view" hidden></main>

<div class="toast" id="toast" role="status"></div>

<script>
const STATUS = {
  new:  { label: "Nouvelle",             cls: "st-new",  color: "var(--info)" },
  nrp:  { label: "NRP",                  cls: "st-nrp",  color: "var(--warn)" },
  call: { label: "Rappel programmé",     cls: "st-call", color: "var(--brand)" },
  conf: { label: "En confirmation",      cls: "st-conf", color: "var(--ok)" },
  conv: { label: "Convertie en dossier", cls: "st-conf", color: "var(--ok)" },
  out:  { label: "Hors cible",           cls: "st-out",  color: "var(--bad)" }
};
const FICHES = [
  { code: "BAR-TH-171", name: "PAC air/eau", country: "FR" },
  { code: "BAR-TH-179", name: "PAC collective", country: "FR" },
  { code: "BAR-TH-129", name: "PAC air/air", country: "FR" },
  { code: "BAR-EN-102", name: "Isolation ITE", country: "FR" },
  { code: "RES060", name: "Bomba de calor", country: "ES" }
];
const MPR = { bleu: "Très modestes", jaune: "Modestes", violet: "Intermédiaires", rose: "Supérieurs" };
const MOTIFS = ["Locataire", "Revenus trop élevés", "Faisabilité technique", "Logement trop petit", "Déjà équipé", "Pas intéressé", "Faux numéro"];
const PAC_CHECKS = ["Adresse complète", "Propriétaire occupant", "Avis d'imposition", "Surface chauffée", "Mode de chauffage actuel", "Photo chaudière"];

const state = { country: "FR", fiche: "BAR-TH-171", status: null, q: "", src: "", selected: null, form: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const srcKey = (s) => s.split(" · ")[0];
const byId = (id) => LEADS.find((l) => l.id === id);
const ficheOf = (code) => FICHES.find((f) => f.code === code);
const todo = (l) => ["new", "nrp", "call", "conf"].includes(l.status);
const ORDER = { new: 0, call: 1, nrp: 2, conf: 3, conv: 4, out: 5 };

function inFiche() { return LEADS.filter((l) => l.fiche === state.fiche); }
function filtered() {
  const q = state.q.trim().toLowerCase();
  return inFiche().filter((l) =>
    (!state.status || l.status === state.status) &&
    (!state.src || srcKey(l.source) === state.src) &&
    (!q || [l.first, l.last, l.phone, l.city, l.cp, l.company || ""].join(" ").toLowerCase().includes(q))
  ).sort((a, b) => (b.late ? 1 : 0) - (a.late ? 1 : 0) || ORDER[a.status] - ORDER[b.status]);
}

function renderFiches() {
  $("#fiches").innerHTML = FICHES.filter((f) => f.country === state.country).map((f) => {
    const all = LEADS.filter((l) => l.fiche === f.code), n = all.filter(todo).length;
    return `<button type="button" role="tab" class="fiche" data-fiche="${f.code}" aria-selected="${f.code === state.fiche}">
      <span class="fc">${f.code}</span><span class="fn">${esc(f.name)}</span>
      <span class="fm">${all.length} pistes${n ? `<span class="hot">${n} à traiter</span>` : ""}</span></button>`;
  }).join("");
}
function renderKpis() {
  const base = inFiche();
  $("#kpis").innerHTML = Object.entries(STATUS).map(([k, s]) =>
    `<button type="button" class="kpi" style="--c:${s.color}" data-status="${k}" aria-pressed="${state.status === k}">
      <span class="n">${base.filter((l) => l.status === k).length}</span><span class="l">${s.label}</span></button>`).join("");
}
function renderSources() {
  const vals = [...new Set(inFiche().map((l) => srcKey(l.source)))];
  if (!vals.includes(state.src)) state.src = "";
  $("#f-src").innerHTML = `<option value="">Toutes les sources</option>` + vals.map((v) => `<option${v === state.src ? " selected" : ""}>${esc(v)}</option>`).join("");
}

const initials = (l) => (l.first[0] + l.last[0]).toUpperCase();
const chip = (l) => `<span class="chip ${STATUS[l.status].cls}">${STATUS[l.status].label}${l.status === "nrp" ? " " + l.nrp + "x" : ""}</span>`;
const mpr = (l) => l.mpr ? `<span class="mpr mpr-${l.mpr}"><i></i>${MPR[l.mpr]}</span>` : `<span class="age">—</span>`;

function renderRows() {
  const list = filtered(), f = ficheOf(state.fiche);
  $("#count").textContent = list.length;
  $("#list-fiche").textContent = `${f.code} ${f.name}`;
  if (!list.find((l) => l.id === state.selected)) { state.selected = list[0] ? list[0].id : null; state.form = null; }
  $("#rows").innerHTML = list.length ? list.map((l) => `
    <tr data-id="${l.id}" tabindex="0" aria-selected="${l.id === state.selected}">
      <td><div class="who"><span class="ini">${initials(l)}</span><div><b>${esc(l.company || l.first + " " + l.last)}</b><span>${l.company ? esc(l.first + " " + l.last) + " · " : ""}${esc(l.city)} · ${l.cp}</span></div></div></td>
      <td>${chip(l)}</td>
      <td class="hide-md">${mpr(l)}</td>
      <td class="hide-md">${esc(srcKey(l.source))}</td>
      <td><span class="age${l.late ? " late" : ""}">${esc(l.next)}${l.late ? " · en retard" : ""}</span></td>
    </tr>`).join("") : `<tr><td colspan="5" class="empty">Aucune piste ne correspond à ces filtres.</td></tr>`;
  renderPanel();
}

function secHouse(l) {
  return `<div class="d-sec"><h3>Logement</h3><dl><dt>Type</dt><dd>${esc(l.house)}</dd><dt>Surface</dt><dd>${esc(l.surface)}</dd><dt>Chauffage</dt><dd>${esc(l.heating)}</dd><dt>Statut</dt><dd>${esc(l.owner)}</dd><dt>Foyer</dt><dd>${esc(l.household)}</dd></dl></div>`;

function secChecks(l) {
  const done = l.checks.filter((c) => c[1]).length, pct = Math.round(done / l.checks.length * 100);
  return `<div class="d-sec"><h3><span>Champs obligatoires de la fiche</span><span>${done}/${l.checks.length}</span></h3>
    <div class="meter-bar"><span style="width:${pct}%"></span></div>
    <ul class="checks">${l.checks.map((c, i) => `<li class="toggle ${c[1] ? "" : "miss"}" data-check="${i}" title="Cliquer pour cocher ou décocher (démo)">${esc(c[0])}</li>`).join("")}</ul></div>`;
}
function secHistory(l) {
  return `<div class="d-sec"><h3>Historique</h3><ul class="timeline">${l.history.map((h) => `<li><div>${esc(h[0])}<small>${esc(h[1])}</small></div></li>`).join("")}</ul></div>`;
}
function decide(l, ctx) {
  const ready = l.checks.every((c) => c[1]);
  if (l.status === "conv") return `<div class="d-sec"><h3>Statuer</h3><p class="hint">Dossier créé. La suite (pré-visite, devis) se gère sur le dossier.</p></div>`;
  const open = (k) => state.form === k;
  const main = l.status === "conf"
    ? `<label style="display:flex;gap:8px;align-items:center;font-size:14px" for="pv-${ctx}"><input type="checkbox" id="pv-${ctx}"> Pré-visite : passage demandé</label>
       <button class="btn btn-primary big" type="button" data-act="conv" ${ready ? "" : "disabled"}>Convertir en dossier</button>`
    : `<button class="btn btn-primary big" type="button" data-act="conf" ${ready ? "" : "disabled"}>Envoyer en confirmation</button>`;
  const missing = l.checks.filter((c) => !c[1]).length;
  return `<div class="d-sec"><h3>Statuer</h3><div class="decide">
    <div class="decide-grid">
      <button type="button" class="dbtn" style="--c:var(--warn)" data-act="nrp">Pas de réponse<small>NRP ${l.nrp + 1}x · relance auto</small></button>
      <button type="button" class="dbtn" style="--c:var(--brand)" data-act="form-call" aria-expanded="${open("call")}">Rappel<small>date et heure</small></button>
      <button type="button" class="dbtn" style="--c:var(--bad)" data-act="form-out" aria-expanded="${open("out")}">Hors cible<small>choisir un motif</small></button>
    </div>
    ${open("call") ? `<div class="decide-form"><label for="rdv-${ctx}">Rappeler le</label><input type="datetime-local" id="rdv-${ctx}" value="2026-11-04T16:00"><button class="btn" type="button" data-act="call">Programmer le rappel</button></div>` : ""}
    ${open("out") ? `<div class="decide-form"><label for="motif-${ctx}">Motif</label><select id="motif-${ctx}">${MOTIFS.map((m) => `<option>${m}</option>`).join("")}</select><button class="btn" type="button" data-act="out">Classer hors cible</button></div>` : ""}
    ${main}
    <p class="hint">${ready ? "Tous les champs obligatoires sont remplis." : missing + " champ(s) obligatoire(s) manquant(s) pour continuer."}</p>
  </div></div>`;
}

function renderPanel() {
  const l = byId(state.selected);
  if (!l) { $("#detail").innerHTML = `<div class="empty">Sélectionnez une piste.</div>`; return; }
  $("#detail").innerHTML = `<div class="d-top">${identity(l)}${badges(l)}${quickActions(l)}
      <a class="btn open-link" href="#piste-${l.id}">Ouvrir la fiche complète →</a></div>
    ${decide(l, "p")}${secChecks(l)}${secContact(l)}${secHouse(l)}${secHistory(l)}`;
}

function stepper(l) {
  const steps = ["Nouvelle", "En traitement", "Confirmation", "Dossier"];
  const idx = { new: 0, nrp: 1, call: 1, conf: 2, conv: 3, out: 1 }[l.status];
  return `<div class="stepper">${steps.map((s, i) => {
    const stop = l.status === "out" && i === idx;
    const cls = stop ? "stop" : (i < idx || (l.status === "conv" && i === idx)) ? "done" : i === idx ? "cur" : "";
    return `<div class="${cls}"><b>${cls === "done" ? "✓" : i + 1}</b>${stop ? "Hors cible" : s}</div>`;
  }).join("")}</div>`;
}

function renderFichePage() {
  const l = byId(state.selected);
  if (!l) { location.hash = ""; return; }
  const list = filtered(), pos = list.findIndex((x) => x.id === l.id);
  const prev = list[pos - 1], next = list[pos + 1], f = ficheOf(l.fiche);
  $("#fiche-view").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <a class="back" href="#">← Pistes · ${f.code} ${esc(f.name)}</a>
      <div class="fp-nav">${pos >= 0 ? `Piste ${pos + 1} sur ${list.length}` : ""}
        <a class="btn" ${prev ? `href="#piste-${prev.id}"` : `aria-disabled="true" style="opacity:.5"`}>‹ Précédente</a>
        <a class="btn" ${next ? `href="#piste-${next.id}"` : `aria-disabled="true" style="opacity:.5"`}>Suivante ›</a></div>
    </div>
    <section class="card"><div class="fp-head">${identity(l)}${badges(l)}<div style="flex:1 1 300px">${quickActions(l)}</div></div>${stepper(l)}</section>
    <div class="fp-grid">
      <div class="fp-main">
        <section class="card">${secContact(l)}</section>
        <section class="card">${secHouse(l)}</section>
        <section class="card wide">${secChecks(l)}</section>
        <section class="card wide">${secHistory(l)}</section>
      </div>
      <div class="fp-side"><section class="card">${decide(l, "f")}</section></div>
    </div>`;
}

function route() {
  const m = location.hash.match(/^#piste-(\d+)$/);
  const l = m && byId(+m[1]);
  if (l) {
    if (state.selected !== l.id) state.form = null;
    state.selected = l.id; state.fiche = l.fiche;
    $("#list-view").hidden = true; $("#fiche-view").hidden = false;
    renderFichePage(); window.scrollTo(0, 0);
  } else {
    $("#fiche-view").hidden = true; $("#list-view").hidden = false; render();
  }
}
function render() { renderFiches(); renderKpis(); renderSources(); renderRows(); }
function refresh() { $("#fiche-view").hidden ? render() : renderFichePage(); }

function now() { const d = new Date(); return "Aujourd'hui " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function act(kind) {
  const l = byId(state.selected), ctx = $("#fiche-view").hidden ? "p" : "f";
  if (!l) return;
  if (kind === "form-call" || kind === "form-out") { const k = kind.slice(5); state.form = state.form === k ? null : k; refresh(); return; }
  if (kind === "nrp") { l.nrp++; l.status = "nrp"; l.next = "Relance SMS auto demain 9:00"; l.late = false; l.history.unshift([`Appel sortant · NRP ${l.nrp}x`, now() + " · relance SMS programmée"]); toast(`NRP ${l.nrp}x enregistré`); }
  if (kind === "call") {
    const v = $("#rdv-" + ctx).value, d = v ? new Date(v) : null;
    const txt = d ? d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " " + v.slice(11, 16) : "à définir";
    l.status = "call"; l.next = "Rappel " + txt; l.late = false; l.history.unshift(["Rappel programmé", now() + " · pour " + txt]); toast("Rappel programmé " + txt);
  }
  if (kind === "out") { const m = $("#motif-" + ctx).value; l.status = "out"; l.next = m; l.late = false; l.history.unshift(["Hors cible · " + m, now()]); toast("Piste classée hors cible"); }
  if (kind === "conf") { l.status = "conf"; l.next = "À confirmer"; l.late = false; l.history.unshift(["Envoyée en confirmation", now()]); toast("Piste envoyée en confirmation"); }
  if (kind === "conv") { const pv = $("#pv-" + ctx) && $("#pv-" + ctx).checked; l.status = "conv"; l.next = "Dossier créé"; l.history.unshift(["Convertie en dossier" + (pv ? " · pré-visite demandée" : ""), now()]); toast("Dossier créé"); }
  state.form = null; refresh();
}

let t;
function toast(msg) { const el = $("#toast"); el.textContent = msg + " (démo)"; el.classList.add("show"); clearTimeout(t); t = setTimeout(() => el.classList.remove("show"), 2200); }

document.addEventListener("click", (e) => {
  const fi = e.target.closest("[data-fiche]");
  if (fi) { state.fiche = fi.dataset.fiche; state.status = null; state.selected = null; render(); return; }
  const k = e.target.closest(".kpi");
  if (k) { state.status = state.status === k.dataset.status ? null : k.dataset.status; renderKpis(); renderRows(); return; }
  const r = e.target.closest("tbody tr[data-id]");
  if (r) { if (state.selected !== +r.dataset.id) state.form = null; state.selected = +r.dataset.id; renderRows(); return; }
  const c = e.target.closest("[data-country]");
  if (c) {
    state.country = c.dataset.country; state.fiche = FICHES.find((f) => f.country === state.country).code; state.status = null; state.selected = null;
    document.querySelectorAll("[data-country]").forEach((b) => b.setAttribute("aria-pressed", b === c)); render(); return;
  }
  const ch = e.target.closest("[data-check]");
  if (ch) { const l = byId(state.selected); l.checks[+ch.dataset.check][1] ^= 1; refresh(); return; }
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) { act(a.dataset.act); return; }
  const b = e.target.closest("[data-toast]");
  if (b) toast(b.dataset.toast);
});
document.addEventListener("dblclick", (e) => { const r = e.target.closest("tbody tr[data-id]"); if (r) location.hash = "piste-" + r.dataset.id; });
document.addEventListener("keydown", (e) => {
  const r = e.target.closest && e.target.closest("tbody tr[data-id]");
  if (r && e.key === "Enter") location.hash = "piste-" + r.dataset.id;
  else if (r && e.key === " ") { e.preventDefault(); state.selected = +r.dataset.id; renderRows(); }
});
$("#q").addEventListener("input", (e) => { state.q = e.target.value; renderRows(); });
$("#f-src").addEventListener("change", (e) => { state.src = e.target.value; renderRows(); });
window.addEventListener("hashchange", route);
route();
</script>
